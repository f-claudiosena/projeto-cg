<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Balãozin - CG Edition (Clipping & Gradient)</title>
  <style>
    body { margin: 0; background: #0a0e27; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
    .ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
    #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border: 2px solid #4da6ff; text-align: center; }
    button { padding: 10px 20px; cursor: pointer; background: #4da6ff; border: none; color: white; font-weight: bold; }
  </style>
</head>
<body>

<div id="menu">
    <h1>BALÃOZIN CG</h1>
    <p>Use as SETAS para voar</p>
    <button onclick="startGame()">INICIAR JOGO</button>
</div>

<div class="ui">
    <div id="scoreDisplay">Score: 0</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ============================================================================
// CONFIGURAÇÕES GERAIS
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 600, H = 400;
canvas.width = W; canvas.height = H;

const pixels = new Uint8ClampedArray(W * H * 4);
const imgData = new ImageData(pixels, W, H);

let gameState = "MENU";
let score = 0;
let balloonY = H / 2;
let balloonX = 100;
let enemies = [];
let winds = []; // Para demonstrar o Clipping
let frameCount = 0;

// ============================================================================
// 1. CLIPPING (COHEN-SUTHERLAND)
// ============================================================================
const INSIDE = 0, LEFT = 1, RIGHT = 2, BOTTOM = 4, TOP = 8;

function computeOutCode(x, y) {
    let code = INSIDE;
    if (x < 0) code |= LEFT; else if (x >= W) code |= RIGHT;
    if (y < 0) code |= BOTTOM; else if (y >= H) code |= TOP;
    return code;
}

function cohenSutherlandClip(x0, y0, x1, y1) {
    let code0 = computeOutCode(x0, y0);
    let code1 = computeOutCode(x1, y1);
    while (true) {
        if (!(code0 | code1)) return {x0, y0, x1, y1};
        if (code0 & code1) return null;
        let x, y, outcodeOut = code0 ? code0 : code1;
        if (outcodeOut & TOP) { x = x0 + (x1 - x0) * (H - 1 - y0) / (y1 - y0); y = H - 1; }
        else if (outcodeOut & BOTTOM) { x = x0 + (x1 - x0) * (0 - y0) / (y1 - y0); y = 0; }
        else if (outcodeOut & RIGHT) { y = y0 + (y1 - y0) * (W - 1 - x0) / (x1 - x0); x = W - 1; }
        else if (outcodeOut & LEFT) { y = y0 + (y1 - y0) * (0 - x0) / (x1 - x0); x = 0; }
        if (outcodeOut === code0) { x0 = x; y0 = y; code0 = computeOutCode(x0, y0); }
        else { x1 = x; y1 = y; code1 = computeOutCode(x1, y1); }
    }
}

// ============================================================================
// 2. RASTERIZAÇÃO E SCANLINE
// ============================================================================
function setPixelAA(x, y, r, g, b, a) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const idx = (Math.floor(y) * W + Math.floor(x)) * 4;
    const alpha = a / 255;
    pixels[idx] = r * alpha + pixels[idx] * (1 - alpha);
    pixels[idx+1] = g * alpha + pixels[idx+1] * (1 - alpha);
    pixels[idx+2] = b * alpha + pixels[idx+2] * (1 - alpha);
    pixels[idx+3] = 255;
}

function drawLineSafe(x0, y0, x1, y1, color) {
    const clipped = cohenSutherlandClip(x0, y0, x1, y1);
    if (!clipped) return;
    // Simples DDA para linha
    let dx = clipped.x1 - clipped.x0, dy = clipped.y1 - clipped.y0;
    let steps = Math.max(Math.abs(dx), Math.abs(dy));
    for(let i=0; i<=steps; i++) {
        setPixelAA(clipped.x0 + dx*i/steps, clipped.y0 + dy*i/steps, color[0], color[1], color[2], color[3]);
    }
}

function scanlineGradientAA(vertices, colors) {
    let yMin = Math.min(...vertices.map(v => v.y)), yMax = Math.max(...vertices.map(v => v.y));
    for (let y = Math.floor(yMin); y <= Math.ceil(yMax); y++) {
        let nodes = [];
        for (let i = 0; i < vertices.length; i++) {
            let p0 = vertices[i], p1 = vertices[(i + 1) % vertices.length];
            if ((p0.y <= y && p1.y > y) || (p1.y <= y && p0.y > y)) {
                let t = (y - p0.y) / (p1.y - p0.y);
                nodes.push({
                    x: p0.x + t * (p1.x - p0.x),
                    c: [
                        colors[i][0] + t*(colors[(i+1)%vertices.length][0]-colors[i][0]),
                        colors[i][1] + t*(colors[(i+1)%vertices.length][1]-colors[i][1]),
                        colors[i][2] + t*(colors[(i+1)%vertices.length][2]-colors[i][2])
                    ]
                });
            }
        }
        nodes.sort((a,b) => a.x - b.x);
        for(let i=0; i<nodes.length; i+=2) {
            if(!nodes[i+1]) break;
            for(let x = Math.floor(nodes[i].x); x <= Math.floor(nodes[i+1].x); x++) {
                setPixelAA(x, y, nodes[i].c[0], nodes[i].c[1], nodes[i].c[2], 255);
            }
        }
    }
}

// ============================================================================
// 3. LÓGICA DO JOGO
// ============================================================================
function spawnWind() {
    winds.push({ x: W + 50, y: Math.random()*H, len: 50 + Math.random()*100, speed: 5 + Math.random()*5 });
}

function update() {
    if (gameState !== "PLAYING") return;
    frameCount++;
    if (frameCount % 30 === 0) spawnWind();
    
    winds.forEach((w, i) => { 
        w.x -= w.speed; 
        if(w.x < -200) winds.splice(i, 1); 
    });

    // Movimento do Balão (Simples)
    if (keys.ArrowUp) balloonY -= 4;
    if (keys.ArrowDown) balloonY += 4;
}

function render() {
    // Limpar tela (Gradiente de Fundo)
    for(let y=0; y<H; y++) {
        let r = 20, g = 30, b = 100 + (y/H)*100;
        for(let x=0; x<W; x++) {
            const idx = (y*W+x)*4;
            pixels[idx] = r; pixels[idx+1] = g; pixels[idx+2] = b; pixels[idx+3] = 255;
        }
    }

    // 1. Desenhar Ventos com COHEN-SUTHERLAND
    // Note que as linhas começam fora (W+50) e terminam fora. O clipping as corta.
    winds.forEach(w => {
        drawLineSafe(w.x, w.y, w.x - w.len, w.y, [255, 255, 255, 100]);
    });

    // 2. Desenhar Balão (Scanline Simples para exemplo)
    const poly = [];
    for(let a=0; a<Math.PI*2; a+=0.5) poly.push({x: balloonX + Math.cos(a)*20, y: balloonY + Math.sin(a)*30});
    const pCols = poly.map(() => [255, 50, 50]);
    scanlineGradientAA(poly, pCols);

    // 3. Desenhar Inimigo (Triângulo com Gradiente por Vértice)
    const tri = [{x: 500, y: 100}, {x: 550, y: 200}, {x: 450, y: 200}];
    const triCols = [[255, 0, 0], [0, 255, 0], [0, 0, 255]]; // Gradiente RGB puro
    scanlineGradientAA(tri, triCols);

    ctx.putImageData(imgData, 0, 0);
    requestAnimationFrame(() => { update(); render(); });
}

// Controles
const keys = {};
window.onkeydown = e => keys[e.key] = true;
window.onkeyup = e => keys[e.key] = false;

function startGame() {
    document.getElementById('menu').style.display = 'none';
    gameState = "PLAYING";
    render();
}
</script>
</body>
</html>
